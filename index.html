<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f3a5f">
<title>Tarjetas Chilenas</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#f4f1ea;--card:#fffdf8;--ink:#1d1d1f;--muted:#6b6b70;--accent:#1f3a5f;--ok:#2e7d4f;--ng:#b3412e;--line:#e2ddd2}
@media (prefers-color-scheme:dark){:root{--bg:#141518;--card:#1e2024;--ink:#ecebe7;--muted:#9a9aa0;--accent:#7fa6d6;--ok:#5fbf86;--ng:#e07a66;--line:#2c2f34}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}
body{display:flex;flex-direction:column;max-width:560px;margin:0 auto;padding:12px 16px calc(16px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{font-size:18px;margin:4px 0;color:var(--accent)}
.stats{font-size:13px;color:var(--muted)}
.iconbtn{background:none;border:none;color:var(--muted);font-size:22px;padding:6px}
#card{flex:1;margin:14px 0;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px 20px;display:flex;flex-direction:column;justify-content:center;min-height:300px;cursor:pointer;user-select:none}
.front{font-size:30px;font-weight:600;text-align:center;line-height:1.3}
.back{margin-top:22px;border-top:1px dashed var(--line);padding-top:18px;font-size:18px;line-height:1.6;display:none}
.back .ex{font-weight:500}
.back .tr{color:var(--muted);font-size:16px;margin-top:6px}
.back .note{margin-top:14px;font-size:14px;background:var(--bg);border-radius:10px;padding:10px 12px;color:var(--ink)}
.shown .back{display:block}
.hint{text-align:center;color:var(--muted);font-size:13px;margin-top:18px}
.shown .hint{display:none}
.buttons{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.buttons button{font-size:18px;font-weight:600;padding:18px;border-radius:14px;border:none;color:#fff}
#ng{background:var(--ng)}#ok{background:var(--ok)}
.buttons button:disabled{opacity:.35}
.done{text-align:center;color:var(--muted)}
.done .big{font-size:22px;color:var(--ink);margin-bottom:8px}
dialog{border:none;border-radius:16px;background:var(--card);color:var(--ink);width:min(92vw,480px);padding:20px}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h2{font-size:17px;margin:0 0 12px}
dialog label{display:block;margin:12px 0 4px;font-size:14px}
dialog input[type=number]{width:90px;font-size:16px;padding:6px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.row button,.plain{font-size:15px;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
#decks{margin-top:10px;display:flex;flex-direction:column;gap:2px}
.deck{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line);margin:0!important;font-size:15px!important}
.deck input{width:20px;height:20px;accent-color:var(--accent)}
.deck span{flex:1}
.deck small{color:var(--muted)}
#stats{cursor:pointer}
dialog{max-height:88vh;overflow:auto}
.small{font-size:12px;color:var(--muted);margin-top:12px;line-height:1.5}
</style>
</head>
<body>
<header>
  <div>
    <h1>Tarjetas Chilenas</h1>
    <div class="stats" id="stats">読み込み中…</div>
  </div>
  <button class="iconbtn" id="menuBtn" aria-label="設定">⚙︎</button>
</header>

<div id="card"><div class="done">読み込み中…</div></div>

<div class="buttons">
  <button id="ng" disabled>まだ</button>
  <button id="ok" disabled>覚えた</button>
</div>

<dialog id="menu">
  <h2>テーマを選ぶ</h2>
  <div class="small" style="margin-top:0">新しいカードはチェックしたテーマから出ます(何も選ばなければ全テーマ)。復習カードはテーマに関係なく全部出ます。</div>
  <div class="row"><button class="plain" id="allDecks">全部外す(=全テーマ)</button></div>
  <div id="decks"></div>
  <h2 style="margin-top:18px">設定・バックアップ</h2>
  <label for="newLimit">1日の新規カード数</label>
  <input type="number" id="newLimit" min="0" max="200">
  <div class="row">
    <button id="syncBtn">カードを再同期</button>
    <button id="exportBtn">進捗を書き出し</button>
    <button id="importBtn">進捗を読み込み</button>
    <input type="file" id="importFile" accept="application/json" hidden>
  </div>
  <div class="small" id="info"></div>
  <div class="row"><button class="plain" id="closeMenu">閉じる</button></div>
</dialog>

<script>
const DAY = 86400000;
const INTERVALS = [0, 1, 3, 7, 14, 30, 60, 120]; // 箱ごとの間隔(日)
const KEY = 'tarjetas.v1';

const safe = {
  get(){ try { return JSON.parse(localStorage.getItem(KEY)) || null } catch { return null } },
  set(v){ try { localStorage.setItem(KEY, JSON.stringify(v)) } catch {} }
};
let S = safe.get() || { progress:{}, newLimit:20, newToday:{date:'',count:0}, lastSync:null };
const save = () => safe.set(S);

let cards = [], queue = [], current = null, shown = false;

// 形式: 単語 ｜ 【例】 例文 (訳)  ※全角｜または半角| で区切る。3列目以降は補足(スペイン/チリの違いなど)
function parse(text){
  const seen = new Set(), out = [];
  let deck = 'その他';
  for (const raw of text.split(/\r?\n/)){
    const line = raw.trim();
    const h = line.match(/^#\s*=+\s*(.+?)\s*=+\s*$/);
    if (h){ deck = h[1]; continue; }
    if (!line || line.startsWith('#')) continue;
    const parts = line.split(/\s*[｜|]\s*/);
    const front = parts[0];
    if (!front || seen.has(front)) continue;
    seen.add(front);
    let back = (parts[1] || '').replace(/^【例】\s*/, '');
    let ex = back, tr = '';
    const m = back.match(/^(.*)[（(]([^()（）]*)[)）]\s*$/);
    if (m){ ex = m[1].trim(); tr = m[2].trim(); }
    out.push({ id:front, front, ex, tr, note:parts.slice(2).join(' / '), deck });
  }
  return out;
}

async function loadCards(force){
  let text = null;
  try {
    const r = await fetch('cards.txt' + (force ? '?t=' + Date.now() : ''), { cache:'no-store' });
    if (r.ok){ text = await r.text(); S.lastSync = Date.now(); save(); }
  } catch {}
  if (text === null){
    try { const c = await caches.match('cards.txt'); if (c) text = await c.text(); } catch {}
  }
  cards = text ? parse(text) : [];
}

const today = () => new Date().toLocaleDateString('sv');

function buildQueue(){
  const now = Date.now();
  if (S.newToday.date !== today()) S.newToday = { date:today(), count:0 };
  const sel = selectedDecks();
  const due = [], freshBy = {};
  for (const c of cards){
    const p = S.progress[c.id];
    if (!p){ if (sel.has(c.deck)) (freshBy[c.deck] ||= []).push(c); }
    else if (p.due <= now) due.push(c); // 復習はテーマに関係なく全部出す
  }
  due.sort((a,b) => S.progress[a.id].due - S.progress[b.id].due);
  // 複数テーマ選択時は1枚ずつ交互に混ぜる
  const lists = Object.values(freshBy), fresh = [];
  for (let i = 0; lists.some(l => i < l.length); i++)
    for (const l of lists) if (i < l.length) fresh.push(l[i]);
  const room = Math.max(0, S.newLimit - S.newToday.count);
  queue = [...due, ...fresh.slice(0, room)];
}

function deckNames(){ return [...new Set(cards.map(c => c.deck))]; }
function selectedDecks(){
  const all = deckNames();
  const s = (S.decks || []).filter(d => all.includes(d));
  return new Set(s.length ? s : all);
}

function stats(){
  const total = cards.length;
  const learned = cards.filter(c => S.progress[c.id]).length;
  const s = (S.decks || []).filter(d => deckNames().includes(d));
  const label = s.length === 0 ? '全テーマ' : s.length === 1 ? s[0].replace(/^DELE B2:\s*/, '') : `${s.length}テーマ`;
  document.getElementById('stats').textContent =
    `${label} ｜ 残り ${queue.length} ｜ 学習済み ${learned}/${total}`;
}

function renderDecks(){
  const box = document.getElementById('decks');
  const sel = new Set(S.decks || []);
  box.innerHTML = deckNames().map((d, i) => {
    const cs = cards.filter(c => c.deck === d);
    const done = cs.filter(c => S.progress[c.id]).length;
    return `<label class="deck"><input type="checkbox" data-d="${i}" ${sel.has(d) ? 'checked' : ''}>
      <span>${esc(d.replace(/^DELE B2:\s*/, ''))}</span><small>${done}/${cs.length}</small></label>`;
  }).join('');
}
function readDecks(){
  const names = deckNames();
  S.decks = [...document.querySelectorAll('#decks input:checked')].map(el => names[+el.dataset.d]);
}

const esc = s => s.replace(/[&<>"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));

function render(){
  const el = document.getElementById('card');
  stats();
  shown = false;
  el.classList.remove('shown');
  document.getElementById('ok').disabled = true;
  document.getElementById('ng').disabled = true;
  current = queue[0] || null;
  if (!current){
    el.innerHTML = cards.length
      ? '<div class="done"><div class="big">¡Listo! 今日の分は終わりです</div>また明日。</div>'
      : '<div class="done"><div class="big">カードがありません</div>オンラインで開いて同期してください。</div>';
    return;
  }
  el.innerHTML =
    `<div class="front">${esc(current.front)}</div>
     <div class="back">
       <div class="ex">${esc(current.ex)}</div>
       ${current.tr ? `<div class="tr">${esc(current.tr)}</div>` : ''}
       ${current.note ? `<div class="note">${esc(current.note)}</div>` : ''}
     </div>
     <div class="hint">タップで答えを表示</div>`;
}

function reveal(){
  if (!current || shown) return;
  shown = true;
  document.getElementById('card').classList.add('shown');
  document.getElementById('ok').disabled = false;
  document.getElementById('ng').disabled = false;
}

function answer(good){
  if (!current || !shown) return;
  const isNew = !S.progress[current.id];
  const p = S.progress[current.id] || { box:0, due:0 };
  if (good){
    p.box = Math.min(p.box + 1, INTERVALS.length - 1);
    p.due = Date.now() + INTERVALS[p.box] * DAY;
    queue.shift();
  } else {
    p.box = 0;
    p.due = Date.now();
    queue.push(queue.shift()); // 同じセッションの最後にもう一度
  }
  S.progress[current.id] = p;
  if (isNew) S.newToday.count++;
  save();
  render();
}

document.getElementById('card').addEventListener('click', reveal);
document.getElementById('ok').addEventListener('click', () => answer(true));
document.getElementById('ng').addEventListener('click', () => answer(false));

// 設定
const menu = document.getElementById('menu');
document.getElementById('stats').onclick = () => document.getElementById('menuBtn').click();
document.getElementById('allDecks').onclick = () => {
  document.querySelectorAll('#decks input').forEach(el => el.checked = false);
};
document.getElementById('menuBtn').onclick = () => {
  renderDecks();
  document.getElementById('newLimit').value = S.newLimit;
  document.getElementById('info').textContent =
    `カード総数: ${cards.length}\n最終同期: ${S.lastSync ? new Date(S.lastSync).toLocaleString('ja-JP') : 'なし'}`;
  menu.showModal();
};
document.getElementById('closeMenu').onclick = () => {
  const v = parseInt(document.getElementById('newLimit').value, 10);
  if (!isNaN(v) && v >= 0){ S.newLimit = v; }
  readDecks(); save();
  menu.close(); buildQueue(); render();
};
document.getElementById('syncBtn').onclick = async () => {
  document.getElementById('info').textContent = '同期中…';
  await loadCards(true); buildQueue(); render(); renderDecks();
  document.getElementById('info').textContent = `同期しました(${cards.length}枚)`;
};
document.getElementById('exportBtn').onclick = () => {
  const blob = new Blob([JSON.stringify(S)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `tarjetas-progreso-${today()}.json`;
  a.click();
};
document.getElementById('importBtn').onclick = () => document.getElementById('importFile').click();
document.getElementById('importFile').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (!d.progress) throw 0;
    S = d; save(); buildQueue(); render();
    document.getElementById('info').textContent = '読み込みました';
  } catch { document.getElementById('info').textContent = 'ファイルが正しくありません'; }
};

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

(async () => { await loadCards(false); buildQueue(); render(); })();
</script>
</body>
</html>
